name: Verification

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          brew install zstd zfp

      - name: Build Sprintz helper
        run: ./evidence/build_sprintz.sh

      - name: Run verification tests
        run: python -m unittest -v evidence/test_evidence_pipeline.py

      - name: Verify committed checksums
        run: shasum -a 256 -c SHA256SUMS
